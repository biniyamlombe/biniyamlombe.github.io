<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tab icon: terracotta square. No initials, no photo. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161412" media="(prefers-color-scheme: dark)" />

    <!--
      Title, description, Open Graph, Twitter, and JSON-LD are injected here
      from src/data/site.js by the siteMeta plugin in vite.config.js.
    -->
    <!-- site-meta -->

    <!--
      The headshot is rendered by React, so the browser cannot find it until the
      JS runs. This preload starts the download immediately and is what keeps
      the largest paint fast. Update it if you rename the file.
    -->
    <link rel="preload" as="image" href="/headshot.webp" type="image/webp" fetchpriority="high" />
    <!--
      Latin Newsreader and Outfit files. Vite fills these in the production
      build, after the filenames are hashed. Dev leaves the marker empty.
    -->
    <!-- font-preload -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
