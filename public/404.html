<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Biniyam Lombe</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" />
    <style>
      :root {
        color-scheme: light;
        --surface: #ffffff;
        --text: #171615;
        --muted: #5c5853;
        --accent: #9b3d32;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--surface);
        color: var(--text);
        font-family: Georgia, "Iowan Old Style", serif;
      }

      main {
        width: min(36rem, calc(100% - 2rem));
      }

      h1 {
        margin: 0 0 0.6rem;
        font-size: 2rem;
        font-weight: 650;
        letter-spacing: -0.03em;
        line-height: 1.15;
      }

      p {
        margin: 0;
        font-size: 1.1rem;
        line-height: 1.6;
      }

      p + p {
        margin-top: 0.95rem;
      }

      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>That address is not on this site.</p>
      <p><a href="/">Back to Biniyam Lombe</a></p>
    </main>
  </body>
</html>
